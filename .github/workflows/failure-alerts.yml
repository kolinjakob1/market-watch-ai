
name: HustleWatch Failure Alerts

on:
  workflow_run:
    workflows:
      - Sports Odds Scanner
      - Stock and Options Scanner
      - HustleWatch Crypto Signals
    types:
      - completed

permissions:
  issues: write

jobs:
  notify:
    if: ${{ contains(fromJSON('["failure","timed_out","cancelled"]'), github.event.workflow_run.conclusion) }}
    runs-on: ubuntu-latest
    steps:
      - name: Record failure in GitHub
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "HustleWatch failure: $WORKFLOW_NAME #$RUN_ID" \
            --body "Scanner failure detected. Check workflow logs: $RUN_URL"

      - name: Alert Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          token = os.environ["TELEGRAM_BOT_TOKEN"].strip()
          if token.startswith("bot"):
              token = token[3:]

          message = (
              "HUSTLEWATCH ALERT\n"
              "SCANNER FAILED\n\n"
              f"{os.environ['WORKFLOW_NAME']}\n"
              f"Logs: {os.environ['RUN_URL']}"
          )

          url = f"https://api.telegram.org/bot{token}/sendMessage"
          payload = json.dumps({
              "chat_id": os.environ["TELEGRAM_CHAT_ID"],
              "text": message
          }).encode()

          request = urllib.request.Request(
              url,
              data=payload,
              headers={"Content-Type": "application/json"}
          )

          with urllib.request.urlopen(request, timeout=20) as response:
              result = json.load(response)
              if not result.get("ok"):
                  raise RuntimeError("Telegram rejected notification")
          PY
