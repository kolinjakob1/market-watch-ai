name: Sports Odds Scanner
on:
  workflow_dispatch:
  # Automatic runs are dispatched by cadence.yml, not GitHub cron.

permissions:
  contents: write
concurrency:
  group: hustlewatch-sports
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Regression checks
        run: python -m unittest -v
      - name: Run scanner
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py
      - name: Persist alert deduplication
        if: always()
        run: |
          if test -f sports_state.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add sports_state.json
            if ! git diff --cached --quiet; then
              git commit -m 'Update sports alert state [skip ci]'
              for attempt in 1 2 3; do
                git pull --rebase origin main && git push origin HEAD:main && exit 0
              done
              exit 1
            fi
          fi

      - name: Notify Telegram on failed dispatched scan
        if: ${{ failure() && github.event_name == 'workflow_dispatch' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python failure_fallback.py
